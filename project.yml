name: NotLooking
options:
  bundleIdPrefix: io.github.tuotuogao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc signing for local builds. macOS may re-ask for Motion & Fitness after each rebuild;
    # to keep the grant stable, switch to CODE_SIGN_STYLE: Automatic + DEVELOPMENT_TEAM: <your team id>.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  NotLooking:
    type: application
    platform: macOS
    sources:
      - path: NotLooking
        excludes: ["Info.plist"]
    info:
      path: NotLooking/Info.plist
      properties:
        CFBundleName: NotLooking
        CFBundleDisplayName: 没在看
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSMotionUsageDescription: NotLooking reads head motion from your AirPods to tell whether you are looking at the screen.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, ja]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tuotuogao.NotLooking
        GENERATE_INFOPLIST_FILE: NO
